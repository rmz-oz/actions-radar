[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "actions-radar"
version = "0.2.0"
description = "Tells you when a GitHub Actions run fails, and which line explains it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rmz-oz" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["github-actions", "ci", "cli", "notifications", "coding-agents"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/rmz-oz/actions-radar"

[project.scripts]
actions-radar = "radar:main"

[tool.setuptools]
py-modules = ["radar"]
